name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            label: VS2022
          - runner: windows-latest
            label: VS2026

    steps:
      - uses: actions/checkout@v4

      # JUCE is fetched at configure time. Caching it turns a multi-minute clone
      # into a few seconds; the key tracks CMakeLists.txt so bumping the pinned
      # JUCE tag invalidates it automatically.
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ matrix.runner }}-${{ hashFiles('CMakeLists.txt') }}

      # The generator is deliberately not pinned: GitHub moves the windows-latest
      # image between Visual Studio versions, and a hardcoded generator breaks
      # the build when it does. CMake picks the newest VS it finds.
      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Show artefact layout
        shell: bash
        run: find build/Pulse_artefacts -maxdepth 4 | sort

      # Uploaded wholesale rather than cherry-picked, so the exact VST3 bundle
      # layout Windows produces doesn't need hardcoding here.
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-windows-${{ matrix.label }}
          path: build/Pulse_artefacts/Release/
          if-no-files-found: error

      # Once SignPath approves the project, signing slots in here: the unsigned
      # artefact above becomes the input to signpath/github-action-submit-signing-request.
