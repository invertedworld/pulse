name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (VST3 + Standalone)
    # Pinned rather than windows-latest: signed release builds should not have
    # their toolchain move underneath them. This is the image windows-latest
    # currently points at (Windows Server 2025 / Visual Studio 2026).
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      # JUCE is fetched at configure time. Caching it turns a multi-minute clone
      # into a few seconds; the key tracks CMakeLists.txt so bumping the pinned
      # JUCE tag invalidates it automatically.
      - name: Cache JUCE
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # The generator is deliberately not pinned: GitHub moves its Windows images
      # between Visual Studio versions, and a hardcoded generator breaks the
      # build when it does. CMake picks the newest Visual Studio it finds.
      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      # Only the two shippable artefacts; the sibling .lib/.exp files are MSVC
      # link intermediates and must not reach a release.
      - name: Stage artefacts
        shell: bash
        run: |
          mkdir -p staging
          cp -r build/Pulse_artefacts/Release/VST3/Pulse.vst3 staging/
          cp    build/Pulse_artefacts/Release/Standalone/Pulse.exe staging/
          find staging | sort

      # The plugin builds on Windows but has never run there. pluginval loads it
      # in a real host harness and exercises the editor, parameters, and state
      # save/restore, so a runtime fault is caught here rather than by a user.
      - name: Validate VST3
        shell: bash
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          7z x pluginval.zip -opluginval > /dev/null
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process \
            --timeout-ms 300000 "staging/Pulse.vst3"

      - name: Zip
        shell: bash
        run: 7z a Pulse-Windows.zip ./staging/*

      - uses: actions/upload-artifact@v7
        with:
          name: Pulse-Windows
          path: Pulse-Windows.zip
          if-no-files-found: error

  macos:
    name: macOS (AU + VST3 + Standalone)
    runs-on: macos-26
    # Tags only. This is what keeps the signing identity safe: secrets are never
    # available to pull requests from forks, and this job never runs for them.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v7

      - name: Cache JUCE
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # Both Developer ID certificates are imported into a throwaway keychain
      # that exists only for this run. The .p12 files are shredded immediately;
      # the runner itself is destroyed afterwards.
      - name: Import signing certificates
        env:
          CERT_APP: ${{ secrets.MACOS_CERT_APP }}
          CERT_APP_PWD: ${{ secrets.MACOS_CERT_APP_PWD }}
          CERT_INSTALLER: ${{ secrets.MACOS_CERT_INSTALLER }}
          CERT_INSTALLER_PWD: ${{ secrets.MACOS_CERT_INSTALLER_PWD }}
          KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          echo "$CERT_APP"       | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$CERT_INSTALLER" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN" \
            -P "$CERT_APP_PWD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" \
            -P "$CERT_INSTALLER_PWD" -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"

          # Without this, codesign blocks on a GUI keychain prompt that nobody
          # can answer on a headless runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" > /dev/null

          security find-identity -v | sed 's/[0-9A-F]\{40\}/<hash>/'

      - name: Build
        run: ./build.sh

      # Reuses the same script run locally, so CI and a hand-cut release cannot
      # drift apart. NOTARY_PASSWORD switches it off the stored keychain profile.
      - name: Sign, package and notarize
        env:
          NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: ./packaging/notarize_and_install.sh

      - name: Verify notarization
        run: |
          PKG=$(ls packaging/output/Pulse-*.pkg)
          spctl --assess --type install -vv "$PKG"
          xcrun stapler validate "$PKG"

      - uses: actions/upload-artifact@v7
        with:
          name: Pulse-macOS
          path: packaging/output/Pulse-*.pkg
          if-no-files-found: error

  # A single release job so both platforms land on one page. Doing it from the
  # build jobs would race: whichever finished first would create the release and
  # the other would fail to.
  release:
    name: Publish release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mv dist/Pulse-Windows.zip "dist/Pulse-${TAG}-Windows.zip"
          ls -la dist
          cat > notes.md <<'EOF'
          **macOS** — installer with AU, VST3 and Standalone. Universal binary, signed and notarized.

          **Windows** — VST3 and Standalone, x64. Currently unsigned, so SmartScreen will warn on first run; see the code signing policy in the README.
          EOF
          # Tolerates a re-run against a tag whose release already exists.
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber dist/*
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "Pulse ${TAG}" --notes-file notes.md dist/*
          fi
