name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (VST3 + Standalone)
    # Pinned rather than windows-latest: signed release builds should not have
    # their toolchain move underneath them. This is the image windows-latest
    # currently points at (Windows Server 2025 / Visual Studio 2026).
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      # JUCE is fetched at configure time. Caching it turns a multi-minute clone
      # into a few seconds; the key tracks CMakeLists.txt so bumping the pinned
      # JUCE tag invalidates it automatically.
      - name: Cache JUCE
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # The generator is deliberately not pinned: GitHub moves its Windows images
      # between Visual Studio versions, and a hardcoded generator breaks the
      # build when it does. CMake picks the newest Visual Studio it finds.
      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      # Only the two shippable artefacts; the sibling .lib/.exp files are MSVC
      # link intermediates and must not reach a release.
      - name: Stage artefacts
        shell: bash
        run: |
          mkdir -p staging
          cp -r build/Pulse_artefacts/Release/VST3/Pulse.vst3 staging/
          cp    build/Pulse_artefacts/Release/Standalone/Pulse.exe staging/
          find staging | sort

      # The plugin builds on Windows but has never run there. pluginval loads it
      # in a real host harness and exercises the editor, parameters, and state
      # save/restore, so a runtime fault is caught here rather than by a user.
      - name: Validate VST3
        shell: bash
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          7z x pluginval.zip -opluginval > /dev/null
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process \
            --timeout-ms 300000 "staging/Pulse.vst3"

      - name: Zip
        shell: bash
        run: 7z a Pulse-Windows.zip ./staging/*

      - uses: actions/upload-artifact@v7
        with:
          name: Pulse-Windows
          path: Pulse-Windows.zip
          if-no-files-found: error

  # Publishing is its own job so the build stays a pure build, and so a second
  # platform can be added later without the two racing to create one release.
  release:
    name: Publish release
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mv dist/Pulse-Windows.zip "dist/Pulse-${TAG}-Windows.zip"
          ls -la dist
          cat > notes.md <<'EOF'
          **macOS** — installer with AU, VST3 and Standalone. Universal binary, signed and notarized.

          **Windows** — VST3 and Standalone, x64. Currently unsigned, so SmartScreen will warn on first run; see the code signing policy in the README.
          EOF
          # Tolerates a re-run against a tag whose release already exists.
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber dist/*
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "Pulse ${TAG}" --notes-file notes.md dist/*
          fi
